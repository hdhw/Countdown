<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rec Room Countdown</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {
    background: radial-gradient(circle at top, #0f172a, #020617);
}
.glow {
    text-shadow: 0 0 20px rgba(139,92,246,0.7);
}
</style>
</head>
<body class="text-white flex items-center justify-center h-screen">

<div class="text-center">
    <h1 class="text-4xl font-bold mb-4 glow">Rec Room Shutdown</h1>
    <p class="text-gray-400 mb-6">June 1st, 2026 • 4:00 PM (Your Time)</p>

    <div id="countdown" class="text-5xl font-mono tracking-widest glow">
        loading...
    </div>
</div>

<script>
const shutdownDate = new Date("2026-06-01T16:00:00");

function updateCountdown() {
    const now = new Date();
    const diff = shutdownDate - now;

    if (diff <= 0) {
        document.getElementById("countdown").innerText = "It's gone 💔";
        return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("countdown").innerText =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
}

setInterval(updateCountdown, 1000);
updateCountdown();
</script>

</body>
</html>
