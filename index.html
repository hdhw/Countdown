<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rec Room — Final Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #f0e6d0;
    --warm: #c9a97a;
    --rust: #c0522a;
    --deep: #0e0a06;
    --mid: #1c140d;
    --text-dim: rgba(240,230,208,0.45);
    --glow-color: rgba(192,82,42,0.55);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--deep);
    color: var(--cream);
    font-family: 'Jost', sans-serif;
    font-weight: 700;
  }

  .rr-logo {
    width: clamp(72px, 10vw, 110px);
    height: clamp(72px, 10vw, 110px);
    object-fit: contain;
    margin-bottom: 20px;
    filter: drop-shadow(0 0 18px rgba(192,82,42,0.5)) drop-shadow(0 0 40px rgba(192,82,42,0.2));
    animation: rise 1s cubic-bezier(0.22,1,0.36,1) both;
  }

  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.035;
    pointer-events: none;
    z-index: 999;
  }

  #bg {
    position: fixed; inset: 0;
    z-index: 0;
  }

  .vignette {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
    z-index: 1;
    pointer-events: none;
  }

  .stage {
    position: relative; z-index: 2;
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0;
  }

  .date-strip {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 14px 0;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-dim);
    border-bottom: 1px solid rgba(240,230,208,0.07);
    z-index: 3;
  }

  .logo-wrap {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 48px;
    animation: rise 1.2s cubic-bezier(0.22,1,0.36,1) both;
  }

  .logo-eyebrow {
    font-size: 11px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 16px;
  }

  .logo-title {
    font-family: 'Jost', sans-serif;
    font-weight: 900;
    font-size: clamp(52px, 9vw, 100px);
    line-height: 0.9;
    letter-spacing: -0.02em;
    color: var(--cream);
    text-align: center;
    position: relative;
  }

  .logo-title em {
    font-style: italic;
    color: var(--warm);
  }

  .logo-subtitle {
    margin-top: 14px;
    font-size: 12px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--rust);
  }

  .divider {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, transparent, var(--warm), transparent);
    margin-bottom: 40px;
    animation: rise 1.4s cubic-bezier(0.22,1,0.36,1) both;
  }

  .countdown-wrap {
    animation: rise 1.5s cubic-bezier(0.22,1,0.36,1) both;
    display: flex; flex-direction: column; align-items: center;
  }

  .countdown-grid {
    display: flex;
    gap: clamp(16px, 3vw, 40px);
    align-items: flex-start;
  }

  .unit {
    display: flex; flex-direction: column; align-items: center;
    gap: 10px;
  }

  .unit-val {
    font-family: 'Jost', sans-serif;
    font-weight: 900;
    font-size: clamp(44px, 7vw, 88px);
    line-height: 1;
    color: var(--cream);
    position: relative;
    min-width: 2ch;
    text-align: center;
    text-shadow:
      0 0 30px var(--glow-color),
      0 0 60px rgba(192,82,42,0.2);
    transition: text-shadow 0.3s;
  }

  .unit-val.tick {
    animation: tick-flash 0.2s ease;
  }

  @keyframes tick-flash {
    0%   { opacity: 0.3; }
    100% { opacity: 1; }
  }

  .unit-sep {
    font-size: clamp(36px, 5vw, 72px);
    color: var(--rust);
    opacity: 0.6;
    margin-top: 4px;
    line-height: 1;
  }

  .unit-label {
    font-size: 10px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .progress-wrap {
    margin-top: 52px;
    width: clamp(280px, 55vw, 600px);
    animation: rise 1.7s cubic-bezier(0.22,1,0.36,1) both;
  }

  .progress-meta {
    display: flex; justify-content: space-between;
    font-size: 10px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--text-dim);
    margin-bottom: 10px;
  }

  .progress-track {
    height: 2px;
    background: rgba(240,230,208,0.08);
    border-radius: 1px;
    position: relative; overflow: visible;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--rust), var(--warm));
    border-radius: 1px;
    transition: width 1s linear;
    position: relative;
  }

  .progress-fill::after {
    content: '';
    position: absolute; right: -1px; top: 50%;
    transform: translateY(-50%);
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--warm);
    box-shadow: 0 0 8px var(--warm), 0 0 20px var(--rust);
  }

  .bottom-strip {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 14px 0;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-dim);
    border-top: 1px solid rgba(240,230,208,0.07);
    z-index: 3;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .scanlines {
    position: fixed; inset: 0; z-index: 1;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 3px,
      rgba(0,0,0,0.04) 3px,
      rgba(0,0,0,0.04) 4px
    );
  }

  .audio-hint {
    position: fixed; bottom: 48px; right: 32px;
    font-size: 10px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--text-dim);
    cursor: pointer;
    z-index: 10;
    display: flex; align-items: center; gap: 8px;
    transition: color 0.2s;
  }

  .audio-hint:hover { color: var(--cream); }

  .audio-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--rust);
    animation: pulse-dot 1.5s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.4; transform: scale(0.7); }
  }

  .audio-dot.paused { animation: none; opacity: 0.3; }

  /* ── MANUAL TRIGGER BUTTON ── */
  #trigger-btn {
    position: fixed;
    bottom: 48px;
    left: 32px;
    z-index: 10;
    background: rgba(192,82,42,0.12);
    border: 1px solid rgba(192,82,42,0.4);
    color: var(--rust);
    font-family: 'Jost', sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    padding: 8px 16px;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #trigger-btn:hover {
    background: rgba(192,82,42,0.25);
    border-color: var(--rust);
    color: var(--warm);
  }

  #trigger-btn:active {
    transform: scale(0.97);
  }

  #trigger-btn.disabled {
    opacity: 0.3;
    pointer-events: none;
  }

  #trigger-btn-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--rust);
  }

  /* photos status indicator */
  #photos-status {
    position: fixed;
    top: 48px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    z-index: 10;
    transition: opacity 1s;
  }

  /* ── BLACK HOLE ── */
  #blackhole-canvas {
    position: fixed; inset: 0;
    z-index: 50;
    pointer-events: none;
    opacity: 0;
  }

  /* ── PHOTO SLIDESHOW ── */
  #slideshow {
    position: fixed; inset: 0;
    z-index: 60;
    display: none;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  #slideshow-img {
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.08s ease;
  }

  /* ── GOODBYE TEXT ── */
  #goodbye {
    position: fixed; inset: 0;
    z-index: 70;
    display: none;
    align-items: center;
    justify-content: center;
    background: #000;
    flex-direction: column;
    gap: 24px;
  }

  #goodbye-text {
    font-family: 'Jost', sans-serif;
    font-weight: 900;
    font-size: clamp(48px, 10vw, 120px);
    color: var(--cream);
    text-align: center;
    letter-spacing: -0.02em;
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 2s ease, transform 2s ease;
    text-shadow: 0 0 60px rgba(192,82,42,0.4), 0 0 120px rgba(192,82,42,0.15);
  }

  #goodbye-text em {
    color: var(--warm);
    font-style: italic;
  }

  #goodbye-year {
    font-size: clamp(12px, 2vw, 18px);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--text-dim);
    opacity: 0;
    transition: opacity 2s ease 1s;
  }

  /* ── SUCK-IN animation ── */
  .suck {
    animation: suck-in var(--suck-dur, 0.7s) cubic-bezier(0.55, 0, 1, 0.45) var(--suck-delay, 0s) forwards !important;
    transform-origin: var(--hole-x, 50%) var(--hole-y, 50%);
  }

  @keyframes suck-in {
    0%   { opacity: 1; transform: scale(1) translate(0,0) rotate(0deg); filter: blur(0px); }
    60%  { opacity: 0.7; filter: blur(1px); }
    100% { opacity: 0; transform: scale(0.02) translate(var(--tx,0), var(--ty,0)) rotate(var(--rot,180deg)); filter: blur(8px); }
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<canvas id="blackhole-canvas"></canvas>
<div class="vignette" id="vignette"></div>
<div class="scanlines" id="scanlines"></div>

<div class="date-strip" id="date-strip">
  <span>June 1, 2026 &nbsp;·&nbsp; 16:00 UTC &nbsp;·&nbsp; Servers offline</span>
</div>

<div id="photos-status">Loading photos…</div>

<div class="stage" id="stage">
  <div class="logo-wrap" id="logo-wrap">
    <img class="rr-logo" src="logo.png" alt="Rec Room logo">
    <div class="logo-eyebrow">With all love.</div>
    <div class="logo-title">Rec <em>Room</em></div>
    <div class="logo-subtitle">2016 – 2026</div>
  </div>

  <div class="divider" id="divider"></div>

  <div id="main-display">
    <div class="countdown-wrap">
      <div class="countdown-grid" id="grid">
        <div class="unit">
          <div class="unit-val" id="days">--</div>
          <div class="unit-label">Days</div>
        </div>
        <div class="unit-sep">:</div>
        <div class="unit">
          <div class="unit-val" id="hours">--</div>
          <div class="unit-label">Hours</div>
        </div>
        <div class="unit-sep">:</div>
        <div class="unit">
          <div class="unit-val" id="mins">--</div>
          <div class="unit-label">Mins</div>
        </div>
        <div class="unit-sep">:</div>
        <div class="unit">
          <div class="unit-val" id="secs">--</div>
          <div class="unit-label">Secs</div>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-meta">
          <span>Launched 2016</span>
          <span id="pct">—</span>
          <span>Shutdown 2026</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="bar" style="width:0%"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="bottom-strip" id="bottom-strip">
  <span id="bottom-msg">Click anywhere to start music</span>
</div>

<!-- Manual trigger button -->
<button id="trigger-btn" onclick="manualTrigger()">
  <div id="trigger-btn-dot"></div>
  <span>Trigger sequence</span>
</button>

<div class="audio-hint" id="audio-btn">
  <div class="audio-dot paused" id="audio-dot"></div>
  <span id="audio-label">Music off</span>
</div>

<audio id="music"></audio>

<!-- Slideshow overlay -->
<div id="slideshow">
  <img id="slideshow-img" src="" alt="">
</div>

<!-- Goodbye overlay -->
<div id="goodbye">
  <div id="goodbye-text">Goodbye,<br><em>Rec Room.</em></div>
  <div id="goodbye-year">2016 — 2026</div>
</div>

<script>
// ── canvas embers ──
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const EMBERS = Array.from({length: 90}, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  r: Math.random() * 1.5 + 0.3,
  vy: -(Math.random() * 0.4 + 0.1),
  vx: (Math.random() - 0.5) * 0.15,
  life: Math.random(),
  maxLife: Math.random() * 0.5 + 0.3,
  hue: Math.random() * 30 + 10,
}));

function drawFrame() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const grad = ctx.createRadialGradient(
    canvas.width * 0.5, canvas.height * 0.35, 0,
    canvas.width * 0.5, canvas.height * 0.35, canvas.width * 0.75
  );
  grad.addColorStop(0, '#1c1008');
  grad.addColorStop(1, '#080503');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  EMBERS.forEach(e => {
    e.life += 0.003;
    if (e.life > e.maxLife) {
      e.life = 0;
      e.x = Math.random() * canvas.width;
      e.y = canvas.height + 10;
    }
    e.x += e.vx;
    e.y += e.vy;

    const alpha = Math.sin((e.life / e.maxLife) * Math.PI) * 0.7;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${e.hue}, 80%, 70%, ${alpha})`;
    ctx.fill();
  });

  requestAnimationFrame(drawFrame);
}
drawFrame();

// ── countdown ──
const SHUTDOWN = new Date("2026-06-01T16:00:00Z");
const LAUNCH   = new Date("2016-01-01T00:00:00Z");
const TOTAL    = SHUTDOWN - LAUNCH;

const dEl   = document.getElementById('days');
const hEl   = document.getElementById('hours');
const mEl   = document.getElementById('mins');
const sEl   = document.getElementById('secs');
const bar   = document.getElementById('bar');
const pct   = document.getElementById('pct');
const bMsg  = document.getElementById('bottom-msg');

function pad(n) { return String(Math.max(0,n)).padStart(2,'0'); }

function animTick(el, val) {
  const padded = pad(val);
  if (el.dataset.prev === padded) return;
  el.dataset.prev = el.textContent;
  el.textContent = padded;
  el.classList.remove('tick');
  void el.offsetWidth;
  el.classList.add('tick');
  setTimeout(() => el.classList.remove('tick'), 350);
}

let shutdownTriggered = false;

function update() {
  const now  = new Date();
  const diff = SHUTDOWN - now;
  const elapsed = now - LAUNCH;

  if (diff <= 0 && !shutdownTriggered) {
    shutdownTriggered = true;
    triggerShutdownSequence();
    return;
  }

  if (shutdownTriggered) return;

  const d  = Math.floor(diff / 86400000);
  const h  = Math.floor((diff % 86400000) / 3600000);
  const mi = Math.floor((diff % 3600000) / 60000);
  const s  = Math.floor((diff % 60000) / 1000);

  animTick(dEl, d);
  animTick(hEl, h);
  animTick(mEl, mi);
  animTick(sEl, s);

  const progress = Math.min(elapsed / TOTAL * 100, 100);
  bar.style.width = progress.toFixed(4) + '%';
  pct.textContent = progress.toFixed(2) + '%';

  if (d > 60)      bMsg.textContent = 'Still time to make memories.';
  else if (d > 14) bMsg.textContent = 'The clock is ticking.. Slowly, yet steadly.';
  else if (d > 3)  bMsg.textContent = 'Cherish the time that remains.';
  else             bMsg.textContent = 'The end is near. Thank you, Rec Room.';
}

setInterval(update, 1000);
update();

// ── audio playlist ──
const TRACKS = [
  { url: 'OOBE.mp3', name: 'OOBE' },
  { url: 'Electar.mp3', name: 'Electar' },
  { url: 'First Impression.mp3', name: 'First Impression' },
  { url: 'Join The Club.mp3', name: 'Join the Club' },
  { url: 'Account Organism.mp3', name: 'Account Organism' },
  { url: 'Paintball River.mp3', name: 'Paintball River' },
  { url: 'Sport Funk.mp3', name: 'Sport Funk' },
];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const music  = document.getElementById('music');
const dot    = document.getElementById('audio-dot');
const albl   = document.getElementById('audio-label');
const abtn   = document.getElementById('audio-btn');

let queue   = shuffle(TRACKS);
let qIdx    = 0;
let playing = false;

// Preload goodbye audio
const goodbyeAudio = new Audio('./Goodbye.mp3');
goodbyeAudio.preload = 'auto';

function loadTrack(idx) {
  const track = queue[idx];
  music.src = track.url;
  music.load();
  albl.textContent = track.name;
}

function nextTrack() {
  qIdx++;
  if (qIdx >= queue.length) {
    queue = shuffle(TRACKS);
    qIdx = 0;
  }
  loadTrack(qIdx);
  if (playing) music.play().catch(() => {});
}

music.addEventListener('ended', nextTrack);
loadTrack(qIdx);

function toggleAudio() {
  if (playing) {
    music.pause();
    dot.classList.add('paused');
    albl.textContent = queue[qIdx].name + ' ·· paused';
  } else {
    music.play().catch(() => {});
    dot.classList.remove('paused');
    albl.textContent = queue[qIdx].name;
  }
  playing = !playing;
}

abtn.addEventListener('click', e => { e.stopPropagation(); toggleAudio(); });
document.addEventListener('click', e => {
  if (!playing) toggleAudio();
}, { once: true });

// ─────────────────────────────────────────────
// ── REC.NET PHOTO FETCHING ──
// ─────────────────────────────────────────────

let verifiedPhotos = [];
const photosStatusEl = document.getElementById('photos-status');

async function fetchRecNetPhotos() {
  photosStatusEl.textContent = 'Fetching photos…';
  try {
    const res = await fetch('./imgs.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    // data is an array
    const items = Array.isArray(data) ? data : [];

    const urls = items
      .filter(item => item && item.ImageName)
      .map(item => `https://img.rec.net/${item.ImageName}?width=1080`);

    if (urls.length === 0) throw new Error('No images found');

    // Shuffle
    for (let i = urls.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [urls[i], urls[j]] = [urls[j], urls[i]];
    }

    verifiedPhotos = urls;
    photosStatusEl.textContent = `${urls.length} photos loaded`;
    setTimeout(() => { photosStatusEl.style.opacity = '0'; }, 2000);
  } catch (err) {
    console.warn('Rec.net photo fetch failed:', err);
    photosStatusEl.textContent = 'Photos unavailable — using fallback';
    setTimeout(() => { photosStatusEl.style.opacity = '0'; }, 3000);
    // Fallback to logo
    verifiedPhotos = ['logo.png'];
  }
}

// Kick off immediately
fetchRecNetPhotos();

// ─────────────────────────────────────────────
// ── MANUAL TRIGGER ──
// ─────────────────────────────────────────────

function manualTrigger() {
  if (shutdownTriggered) return;
  shutdownTriggered = true;
  document.getElementById('trigger-btn').classList.add('disabled');
  triggerShutdownSequence();
}

// ─────────────────────────────────────────────
// ── BLACK HOLE CANVAS ──
// ─────────────────────────────────────────────

const bhCanvas = document.getElementById('blackhole-canvas');
const bhCtx = bhCanvas.getContext('2d');
let bhAnimId = null;
let bhRadius = 0;
let bhPulse = 0;
let bhParticles = [];

function resizeBH() {
  bhCanvas.width = window.innerWidth;
  bhCanvas.height = window.innerHeight;
}
resizeBH();
window.addEventListener('resize', resizeBH);

function createBHParticles(cx, cy) {
  bhParticles = Array.from({ length: 300 }, () => {
    const angle = Math.random() * Math.PI * 2;
    const dist  = Math.random() * Math.min(window.innerWidth, window.innerHeight) * 0.6 + 80;
    return {
      x: cx + Math.cos(angle) * dist,
      y: cy + Math.sin(angle) * dist,
      angle,
      dist,
      speed: Math.random() * 1.5 + 0.5,
      size:  Math.random() * 2.5 + 0.5,
      hue:   Math.random() * 60 + 200,
      alpha: Math.random() * 0.8 + 0.2,
    };
  });
}

function drawBlackHole(cx, cy, progress) {
  bhCtx.clearRect(0, 0, bhCanvas.width, bhCanvas.height);

  bhCtx.fillStyle = `rgba(0,0,0,${progress * 0.7})`;
  bhCtx.fillRect(0, 0, bhCanvas.width, bhCanvas.height);

  const maxR = Math.max(bhCanvas.width, bhCanvas.height) * 0.55;
  bhRadius = progress * maxR * 0.18;
  bhPulse += 0.04;

  const ringCount = 6;
  for (let i = ringCount; i >= 1; i--) {
    const ringR = Math.max(bhRadius * 0.7 + 1, bhRadius * (1 + i * 0.55) + Math.sin(bhPulse + i) * 3);
    const alpha = (0.35 / i) * progress;
    const grad = bhCtx.createRadialGradient(cx, cy, bhRadius * 0.7, cx, cy, ringR);
    grad.addColorStop(0,   `hsla(${30 + i*15}, 90%, 60%, ${alpha})`);
    grad.addColorStop(0.5, `hsla(${200 + i*20}, 70%, 50%, ${alpha * 0.5})`);
    grad.addColorStop(1,   'transparent');
    bhCtx.beginPath();
    bhCtx.arc(cx, cy, ringR, 0, Math.PI * 2);
    bhCtx.fillStyle = grad;
    bhCtx.fill();
  }

  bhParticles.forEach(p => {
    p.angle -= (p.speed * 0.015) * (1 + progress * 2);
    p.dist  -= p.speed * 0.5 * progress;
    p.x = cx + Math.cos(p.angle) * p.dist;
    p.y = cy + Math.sin(p.angle) * p.dist;

    if (p.dist < bhRadius) {
      p.dist = Math.random() * Math.min(window.innerWidth, window.innerHeight) * 0.5 + 100;
      p.alpha = Math.random() * 0.6 + 0.2;
    }

    const alpha = p.alpha * Math.min(p.dist / bhRadius, 1) * progress;
    bhCtx.beginPath();
    bhCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    bhCtx.fillStyle = `hsla(${p.hue}, 80%, 70%, ${alpha})`;
    bhCtx.fill();
  });

  const lensGrad = bhCtx.createRadialGradient(cx, cy, 0, cx, cy, bhRadius * 2.5);
  lensGrad.addColorStop(0,    'rgba(0,0,0,1)');
  lensGrad.addColorStop(0.45, 'rgba(0,0,0,1)');
  lensGrad.addColorStop(0.65, `rgba(255,140,40,${0.25 * progress})`);
  lensGrad.addColorStop(1,    'transparent');
  bhCtx.beginPath();
  bhCtx.arc(cx, cy, bhRadius * 2.5, 0, Math.PI * 2);
  bhCtx.fillStyle = lensGrad;
  bhCtx.fill();

  bhCtx.beginPath();
  bhCtx.arc(cx, cy, bhRadius, 0, Math.PI * 2);
  bhCtx.fillStyle = '#000';
  bhCtx.fill();
}

// ── Full shutdown sequence ──
function triggerShutdownSequence() {
  // Stop current music and play Coach message
  music.pause();
  goodbyeAudio.currentTime = 0;
  goodbyeAudio.play().catch(() => {});
  albl.textContent = 'Coach Message';
  dot.classList.remove('paused');

  // Hide the trigger button immediately
  const btn = document.getElementById('trigger-btn');
  btn.style.transition = 'opacity 0.3s';
  btn.style.opacity = '0';
  setTimeout(() => { btn.style.display = 'none'; }, 350);

  const cx = window.innerWidth  / 2;
  const cy = window.innerHeight / 2;

  const suckTargets = [
    document.getElementById('date-strip'),
    document.getElementById('bottom-strip'),
    document.getElementById('audio-btn'),
    document.getElementById('scanlines'),
    document.getElementById('vignette'),
    document.querySelector('.progress-wrap'),
    document.getElementById('grid'),
    document.getElementById('divider'),
    document.getElementById('logo-wrap'),
  ];

  bhCanvas.style.opacity = '1';
  createBHParticles(cx, cy);

  let bhProgress = 0;
  const bhGrowDuration = 3000;
  const bhStart = performance.now();

  function growBH(now) {
    bhProgress = Math.min((now - bhStart) / bhGrowDuration, 1);
    drawBlackHole(cx, cy, bhProgress);
    if (bhProgress < 1) {
      bhAnimId = requestAnimationFrame(growBH);
    } else {
      suckElements(suckTargets, cx, cy, () => {
        expandBlackHole(cx, cy, () => {
          startSlideshow(() => {
            showGoodbye();
          });
        });
      });
    }
  }
  requestAnimationFrame(growBH);
}

function suckElements(targets, cx, cy, onDone) {
  const delay = 280;
  let totalTime = 0;

  targets.forEach((el, i) => {
    if (!el) return;
    const suckDelay = i * delay;
    totalTime = suckDelay + 700;

    setTimeout(() => {
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const elCx = rect.left + rect.width  / 2;
      const elCy = rect.top  + rect.height / 2;

      const dx = cx - elCx;
      const dy = cy - elCy;
      const rot = (Math.random() * 360 + 180) + 'deg';

      el.style.setProperty('--hole-x', '50%');
      el.style.setProperty('--hole-y', '50%');
      el.style.setProperty('--tx', `${dx}px`);
      el.style.setProperty('--ty', `${dy}px`);
      el.style.setProperty('--rot', rot);
      el.style.setProperty('--suck-dur', '0.65s');
      el.style.setProperty('--suck-delay', '0s');
      el.classList.add('suck');
    }, suckDelay);
  });

  setTimeout(onDone, totalTime + 400);
}

function expandBlackHole(cx, cy, onDone) {
  const startR = bhRadius;
  const targetR = Math.sqrt(cx * cx + cy * cy) * 2.5;
  const duration = 1200;
  const start = performance.now();

  function frame(now) {
    const t = Math.min((now - start) / duration, 1);
    const eased = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    const r = startR + (targetR - startR) * eased;

    bhCtx.clearRect(0, 0, bhCanvas.width, bhCanvas.height);
    bhCtx.fillStyle = 'rgba(0,0,0,0.95)';
    bhCtx.fillRect(0, 0, bhCanvas.width, bhCanvas.height);

    bhCtx.beginPath();
    bhCtx.arc(cx, cy, r, 0, Math.PI * 2);
    bhCtx.fillStyle = '#000';
    bhCtx.fill();

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      bhCtx.fillStyle = '#000';
      bhCtx.fillRect(0, 0, bhCanvas.width, bhCanvas.height);
      onDone();
    }
  }
  requestAnimationFrame(frame);
}

// ── Photo slideshow using Rec.net photos ──
function startSlideshow(onDone) {
  const el  = document.getElementById('slideshow');
  const img = document.getElementById('slideshow-img');
  el.style.display = 'flex';

  const photos = verifiedPhotos.length > 0
    ? [...verifiedPhotos]
    : ['logo.png'];

  const totalPhotos = photos.length;
  let idx = 0;

  function showNext() {
    if (idx >= totalPhotos) {
      el.style.transition = 'opacity 0.5s ease';
      el.style.opacity = '0';
      setTimeout(() => { el.style.display = 'none'; onDone(); }, 500);
      return;
    }

    const progress = idx / totalPhotos;
    const duration = Math.round(150 - progress * 120); // Faster: 150ms to 30ms

    img.src = photos[idx];
    img.style.opacity = '0';
    void img.offsetWidth;
    img.style.transition = `opacity ${Math.min(duration * 0.3, 30)}ms ease`;
    img.style.opacity = '1';

    idx++;
    setTimeout(showNext, duration);
  }

  showNext();
}

function showGoodbye() {
  const el   = document.getElementById('goodbye');
  const text = document.getElementById('goodbye-text');
  const year = document.getElementById('goodbye-year');

  el.style.display = 'flex';
  requestAnimationFrame(() => {
    text.style.opacity = '1';
    text.style.transform = 'scale(1)';
    year.style.opacity = '1';
  });
}
