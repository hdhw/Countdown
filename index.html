<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rec Room Final Countdown</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle at top, #0f172a, #020617);
    font-family: sans-serif;
}

/* glow */
.glow {
    text-shadow: 0 0 25px rgba(139,92,246,0.8);
}

/* animated gradient overlay */
.bg-anim {
    position: absolute;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, #1e293b, #020617, #4c1d95);
    animation: move 15s infinite linear;
    opacity: 0.4;
}

@keyframes move {
    0% { transform: translate(0,0); }
    100% { transform: translate(-50%, -50%); }
}

/* particles */
.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    opacity: 0.6;
    animation: float linear infinite;
}

@keyframes float {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); }
}

/* fade at end */
.fade-out {
    animation: fade 3s forwards;
}

@keyframes fade {
    to { opacity: 0; }
}
</style>
</head>

<body class="text-white flex items-center justify-center h-screen">

<div class="bg-anim"></div>

<div class="text-center z-10">
    <h1 class="text-5xl font-bold mb-4 glow">Rec Room</h1>
    <p class="text-gray-400 mb-6">Final Moments</p>

    <div id="countdown" class="text-6xl font-mono glow tracking-widest">
        loading...
    </div>
</div>

<audio id="music" autoplay loop>
    <source src="https://files.catbox.moe/9rmp8d.mp3" type="audio/mpeg">
</audio>

<script>
const shutdownDate = new Date("2026-06-01T16:00:00");
const countdownEl = document.getElementById("countdown");
const music = document.getElementById("music");

/* autoplay fix */
document.addEventListener("click", () => {
    music.play().catch(()=>{});
});

/* particles */
for (let i = 0; i < 100; i++) {
    let p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDuration = (5 + Math.random() * 10) + "s";
    p.style.opacity = Math.random();
    document.body.appendChild(p);
}

function updateCountdown() {
    const now = new Date();
    const diff = shutdownDate - now;

    if (diff <= 0) {
        countdownEl.innerText = "It's gone 💔";
        document.body.classList.add("fade-out");
        music.pause();
        return;
    }

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const m = Math.floor((diff / (1000 * 60)) % 60);
    const s = Math.floor((diff / 1000) % 60);

    countdownEl.innerText = `${d}d ${h}h ${m}m ${s}s`;
}

setInterval(updateCountdown, 1000);
updateCountdown();
</script>

</body>
</html>
